[project]
name = "chronograph"
version = "0.1.0"
description = "Graph-native agent memory system built on HydraDB — Hack Hydra 2026"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "neo4j>=5.20.0",
    "openai>=1.30.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "streamlit>=1.35.0",
    "pyvis>=0.3.2",
    "tqdm>=4.66.0",
    "rapidfuzz>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["chronograph*"]

[tool.ruff]
target-version = "py311"
line-length = 100
